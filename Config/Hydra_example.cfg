### --------- FANS -------- ###

[heater_fan he1_fan]
pin: Hydra:PC9
heater:heater1
max_power:1.0
shutdown_speed:0.0
hardware_pwm:false
kick_start_time:0.10
off_below:0.1
tachometer_pin: Hydra:PD0
tachometer_ppr: 2
tachometer_poll_interval: 0.0005

